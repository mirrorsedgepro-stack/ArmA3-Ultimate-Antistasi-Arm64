services:
  arma3:
    build: .
    image: arma3-antistasi:latest
    container_name: arma3_antistasi
    network_mode: host
    # DGX Spark (GB10): 5-9,15-19 are the Cortex-X925 performance cores;
    # 0-4,10-14 are slower A725 efficiency cores. Keep Arma's per-process
    # main threads (server + HCs) off the efficiency cores.
    cpuset: "5-9,15-19"
    restart: unless-stopped
    env_file: .env
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
    volumes:
      # Persistent storage for Arma 3 server root directory and binaries
      - server_base:/arma3

      # Host bind mounts for configurations, missions, and custom mods
      - ./configs:/arma3/configs
      - ./missions:/arma3/mpmissions
      - ./mods:/arma3/mods
      - ./servermods:/arma3/servermods
      - ./extensions:/arma3/extensions
      - ./Discord_Message_API:/arma3/Discord_Message_API
      - ./userconfig:/arma3/userconfig
      - ./container_src/launch.py:/launch.py

      # Persistent storage for Arma 3 server base game depots & DLCs
      - addons:/arma3/addons
      - argo:/arma3/argo
      - enoch:/arma3/enoch
      - expansion:/arma3/expansion
      - heli:/arma3/heli
      - jets:/arma3/jets
      - orange:/arma3/orange

      # Persistent storage for SteamCMD and downloaded Steam Workshop mods
      - steamcmd_fex:/steamcmd
      - workshop:/arma3/steamapps

      # Persistent storage for Steam credentials, session tokens, and Steam Guard
      - steam_data:/root/Steam
      - steam_root:/root/.steam

  discord_bot:
    build:
      context: ./services/arma3webservice
      dockerfile: Dockerfile
    image: arma3webservice:latest
    container_name: arma3_discord_bot
    restart: unless-stopped
    network_mode: host
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=5048
      - Jwt_Secret=${DISCORD_JWT_SECRET}
      - APIKey=${DISCORD_API_KEY}
      - DB_PROVIDER=SQLite
      - DB_CONNECTION_STRING=Data Source=.data/data.db
      - BotToken=${DISCORD_BOT_TOKEN}
      - MonitorChannel=${DISCORD_MONITOR_CHANNEL}
      - AdminChannel=${DISCORD_ADMIN_CHANNEL}
      - AdminLoggingChannel=${DISCORD_ADMIN_LOG_CHANNEL}
      - LoggingChannel=${DISCORD_LOG_CHANNEL}
      - AdminPassword=${ARMA_PASSWORD_ADMIN}
    volumes:
      - discord_bot_data:/app/.data
      - discord_bot_profiles:/app/.profile

  telemetry_bridge:
    build:
      context: ./services/telemetry_bridge
      dockerfile: Dockerfile
    image: arma3-telemetry-bridge:latest
    container_name: arma3_telemetry_bridge
    restart: unless-stopped
    network_mode: host
    environment:
      - TELEMETRY_HOST=0.0.0.0
      - TELEMETRY_PORT=${TELEMETRY_PORT:-2310}
      - TELEMETRY_API_KEY=${TELEMETRY_API_KEY:-}
      - A2S_HOST=127.0.0.1
      - A2S_PORT=${ARMA_QUERY_PORT:-2303}
      - PORT=${PORT:-2302}
      - SERVER_PUBLIC_IP=${SERVER_PUBLIC_IP:-180.181.238.103}
      - ARMA_CONTAINER_NAME=arma3_antistasi
      - HEADLESS_CLIENTS=${HEADLESS_CLIENTS:-3}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/main.cfg:/config/main.cfg:ro
      - telemetry_data:/data

volumes:
  server_base:
    name: armaa_server_base
    external: true
  addons:
  argo:
  enoch:
  expansion:
  heli:
  jets:
  orange:
  steamcmd_fex:
  workshop:
  steam_data:
  steam_root:
  discord_bot_data:
  discord_bot_profiles:
  telemetry_data:

