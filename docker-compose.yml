services:
  arma3:
    build: .
    image: arma3-antistasi:latest
    container_name: arma3_antistasi
    network_mode: host
    # DGX Spark (GB10): 5-9,15-19 are the Cortex-X925 performance cores;
    # 0-4,10-14 are slower A725 efficiency cores. Keep Arma's per-process
    # main threads (server + HCs) off the efficiency cores.
    cpuset: "5-9,15-19"
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persistent storage for Arma 3 server root directory and binaries
      - server_base:/arma3

      # Host bind mounts for configurations, missions, and custom mods
      - ./configs:/arma3/configs
      - ./missions:/arma3/mpmissions
      - ./mods:/arma3/mods
      - ./servermods:/arma3/servermods
      - ./container_src/launch.py:/launch.py

      # Persistent storage for Arma 3 server base game depots & DLCs
      - addons:/arma3/addons
      - argo:/arma3/argo
      - enoch:/arma3/enoch
      - expansion:/arma3/expansion
      - heli:/arma3/heli
      - jets:/arma3/jets
      - orange:/arma3/orange

      # Persistent storage for SteamCMD and downloaded Steam Workshop mods
      - steamcmd_fex:/steamcmd
      - workshop:/arma3/steamapps

      # Persistent storage for Steam credentials, session tokens, and Steam Guard
      - steam_data:/root/Steam
      - steam_root:/root/.steam

      # OpenClaw Game Master command spool, read by the @a3gm server addon (services/gm_bridge)
      - ./gm_spool:/arma3/gm_spool

  telemetry_bridge:
    build:
      context: ./services/telemetry_bridge
      dockerfile: Dockerfile
    image: arma3-telemetry-bridge:latest
    container_name: arma3_telemetry_bridge
    # Efficiency cores only: map tile rendering must never compete with Arma's
    # performance cores (5-9, 15-19).
    cpuset: "0-4,10-14"
    restart: unless-stopped
    network_mode: host
    environment:
      - TELEMETRY_HOST=0.0.0.0
      - TELEMETRY_PORT=${TELEMETRY_PORT:-2310}
      - TELEMETRY_API_KEY=${TELEMETRY_API_KEY:-}
      - A2S_HOST=127.0.0.1
      - A2S_PORT=${ARMA_QUERY_PORT:-2303}
      - PORT=${PORT:-2302}
      - SERVER_PUBLIC_IP=${SERVER_PUBLIC_IP:-180.181.238.103}
      - ARMA_CONTAINER_NAME=arma3_antistasi
      - HEADLESS_CLIENTS=${HEADLESS_CLIENTS:-3}
      - MAP_POSITION_DELAY=${MAP_POSITION_DELAY:-0}
      - MAP_SHOW_HQ=${MAP_SHOW_HQ:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/main.cfg:/config/main.cfg:ro
      - telemetry_data:/data

  # TeamSpeak 3 for TFAR. x86-only image: runs under the host's QEMU binfmt (scripts/setup_binfmt.sh).
  # The free license allows 32 slots, and the Game Master's voice bot takes one of them.
  teamspeak:
    image: teamspeak:3.13
    platform: linux/amd64
    container_name: teamspeak_server
    cpuset: "0-4,10-14"
    restart: unless-stopped
    network_mode: host
    environment:
      - TS3SERVER_LICENSE=accept
      - TS3SERVER_SERVERADMIN_PASSWORD=${TS3_SERVERADMIN_PASSWORD:?set TS3_SERVERADMIN_PASSWORD in .env}
    volumes:
      - teamspeak_data:/var/ts3server

  # The Game Master's voice: a TeamSpeak client that plays openclaw-gm's rendered transmissions.
  ts3audiobot:
    build:
      context: ./services/ts3audiobot
    image: armaa-ts3audiobot:latest
    container_name: ts3audiobot
    cpuset: "0-4,10-14"
    restart: unless-stopped
    network_mode: host
    depends_on:
      - teamspeak
    environment:
      - TS3AB_NAME=${TS3_BOT_NAME:-[HQ] OVERLORD}
      - TS3AB_CHANNEL=${TS3_BOT_CHANNEL:-TaskForceRadio}
      - TS3AB_CHANNEL_PASSWORD=${TS3_BOT_CHANNEL_PASSWORD:-123}
    volumes:
      - ts3audiobot_data:/data
      - ${GM_AUDIO_DIR:-../openclaw-gm/output}:/audio:ro
      # Players' utterances for the Game Master to transcribe (plugins/OpenClawEars.cs)
      - ${GM_VOICE_DIR:-../openclaw-gm/voice_in}:/voice_in

volumes:
  server_base:
    name: armaa_server_base
    external: true
  addons:
  argo:
  enoch:
  expansion:
  heli:
  jets:
  orange:
  steamcmd_fex:
  workshop:
  steam_data:
  steam_root:
  telemetry_data:
  teamspeak_data:
  ts3audiobot_data:
