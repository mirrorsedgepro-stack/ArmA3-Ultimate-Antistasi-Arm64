// ==============================================================================
// Arma 3 Dedicated Server - Antistasi Ultimate 32-Player Production Config
// ==============================================================================

// Server Identity & Join Credentials
hostname = "Frenchy's Antistasi Ultimate [RHS] | 32-Player Dedicated";
password = "${ARMA_PASSWORD}";          // Server join password for players
passwordAdmin = "${ARMA_PASSWORD_ADMIN}";    // In-game admin password (#login <password>)
serverCommandPassword = "${ARMA_PASSWORD_COMMAND}";

// Player Slots & Access Control
maxPlayers = 32;
kickDuplicate = 1;                          // Prevent duplicate player IDs
verifySignatures = 2;                       // Enforce .bikey signature checks for client mods
allowedFilePatching = 1;                    // 1 = Allow Headless Clients and server file patching
requiredSecureId = 2;

// Headless Clients (HCs) Network Authorization
// BrettMayson container automatically connects HCs via localhost 127.0.0.1
headlessClients[] = {"127.0.0.1"};
localClient[] = {"127.0.0.1"};

// Security & Anti-Cheat
BattlEye = 1;
onUnsignedData = "kick (_this select 0)";
onHackedData = "kick (_this select 0)";
onDifferentData = "";
doubleIdDetected = "";

// In-Game Voice Communications (VON) - High Definition Voice Tuning
disableVoN = 0;
vonCodec = 1;                               // 1 = Opus Voice Codec
vonCodecQuality = 15;                       // 15 = High quality voice (up to 30 kbps)

// Logging & Server Heartbeat
timeStampFormat = "short";
logFile = "server_console.log";
disconnectTimeout = 10;
steamProtocolMaxDataSize = 4096;            // Default 1024 overflows with the 42-mod list; the browser then shows no mods

// Voting & Persistence Controls
voteMissionPlayers = 3;
voteThreshold = 1.5;                         // Setting > 1.0 disables public voting; only admins can change missions
persistent = 1;                              // 1 = Server remains alive and keeps mission state when all players disconnect

// Whitelisted File Extensions
allowedLoadFileExtensions[] = {"h","hpp","sqs","sqf","fsm","cpp","paa","txt","xml","inc","ext","sqm","ods","fxy","lip","csv","kb","bik","bikb","html","htm","biedi","b64"};
allowedPreprocessFileExtensions[] = {"h","hpp","sqs","sqf","fsm","cpp","paa","txt","xml","inc","ext","sqm","ods","fxy","lip","csv","kb","bik","bikb","html","htm","biedi"};
allowedHTMLLoadExtensions[] = {"htm","html","xml","txt"};

// MOTD (Message of the Day)
motd[] = {
    "==================================================",
    " Welcome to the Antistasi Ultimate Dedicated Server! ",
    " Guerrilla Campaign on Altis with RHS Escalation  ",
    " Headless Clients Active: Garrison & QRF AI Handled",
    "=================================================="
};
motdInterval = 10;

// Mission Cycle - Direct Auto-Launch Antistasi Altis with Persistent Auto-Load
class Missions {
    class AntistasiAltis {
        template = "Antistasi_Altis.Altis";
        difficulty = "Regular";

        class Params {
            autoLoadLastGame = 60;          // Auto-resume existing Antistasi campaign save 60s after first player joins
            LogLevel = 1;                   // 1 = Info logging
            A3A_logDebugConsole = 1;        // 1 = Log debug console allowed for logged-in admins
        };
    };
};
