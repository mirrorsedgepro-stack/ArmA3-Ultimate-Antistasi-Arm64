// ==============================================================================
// Arma 3 Dedicated Server - basic.cfg (Network & Engine Performance Tuning)
// Optimized for 32 simultaneous players with dynamic AI and Headless Clients
// ==============================================================================

language = "English";
adapter = -1;
3D_Performance = 1;
Resolution_W = 0;
Resolution_H = 0;
Resolution_Bpp = 32;

// Network Bandwidth Allocation (in bits per second)
// 131072000 = 131 Mbps minimum guaranteed bandwidth
// 1073741824 = 1 Gbps maximum allocated bandwidth
MinBandwidth = 131072000;
MaxBandwidth = 1073741824;

// Packet Delivery & Message Rates
// MaxMsgSend sets the message budget per server tick. Default is 128-256 which causes
// severe desync with 32 players in intense combat. 2048 provides smooth synchronization.
MaxMsgSend = 2048;
MaxSizeGuaranteed = 1024;
MaxSizeNonguaranteed = 512;

// Spatial Error Tolerances
// Controls how much a unit's position can drift before a network update is forced
MinErrorToSend = 0.002;
MinErrorToSendNear = 0.01;

// Prevent client custom files (avatars, sounds) from jamming server network throughput
MaxCustomFileSize = 0;

// MTU and UDP Packet Framing
// 1400 bytes fits cleanly within standard 1500-byte MTUs without IP fragmentation
class sockets {
    maxPacketSize = 1400;
};
